<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title> Steelix is the best!</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/title.css" />
    <link rel="stylesheet" href="css/themes/johto.css" />
    <link rel="stylesheet" href="css/themes/hoenn.css" />
    <link rel="stylesheet" href="css/themes/sinnoh.css" />
    <link rel="stylesheet" href="css/themes/unova.css" />
    <link rel="stylesheet" href="css/themes/kalos.css" />
    <link rel="stylesheet" href="css/themes/alola.css" />
    <link rel="stylesheet" href="css/themes/galar.css" />
    <link rel="stylesheet" href="css/themes/paldea.css" />
    <link rel="stylesheet" href="css/themes/other.css" />
  </head>

  <body>
    <!-- ===== Title page ===== -->
    <div id="title">
      <h1>POKeDEX</h1>
      <p>Choose any region</p>
      <div class="regions" id="regions"></div>
      <div class="title-links">
        <button data-dex="national">National Pokedex</button>
        <button data-dex="megas">Other Pokedexes</button>
      </div>
    </div>

    <!-- ===== The Pokedex ===== -->
    <div id="app" hidden>
      <button id="back">◀ REGIONS</button>
      <div id="dexTabs"></div>

      <div class="dex">
        <!-- LEFT HALF: screen and D-pad -->
        <div class="panel left">
          <div class="lights">
            <div class="lens"></div>
            <div class="led r"></div>
            <div class="led y"></div>
            <div class="led g"></div>
          </div>

          <div class="bezel">
            <div class="screen">
              <div class="top">
                <div class="left-col">
                  <img id="sprite" src="" alt="" />
                  <div class="dexno" id="dexno"></div>
                </div>
                <div class="info">
                  <div id="name"></div>
                  <div id="species"></div>
                  <div class="row"><span>HT</span><span id="ht"></span></div>
                  <div class="row"><span>WT</span><span id="wt"></span></div>
                  <div class="types" id="types"></div>
                </div>
              </div>
              <div class="divider">
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
              </div>
              <div class="desc" id="desc"></div>
            </div>
          </div>

          <div class="bottom">
            <div class="round"></div>
            <div class="green-screen" id="status">POKeDEX</div>
            <div class="dpad">
              <button class="up" id="up">▲</button>
              <button class="left-b" id="prev">◀</button>
              <div class="mid"></div>
              <button class="right-b" id="next">▶</button>
              <button class="down" id="down">▼</button>
            </div>
          </div>
        </div>

        <div class="hinge"></div>

        <!-- RIGHT HALF: search, keypad, buttons -->
        <div class="panel right">
          <div class="dark-display">
            <label>NAME OR NUMBER</label>
            <input id="search" placeholder="e.g. Steelix" autocomplete="off" />
          </div>

          <div class="blue-grid" id="keypad">
            <button>1</button><button>2</button><button>3</button><button>4</button><button>5</button>
            <button>6</button><button>7</button><button>8</button><button>9</button><button>0</button>
          </div>

          <div class="bottom-right">
            <div class="white-btns">
              <button id="clear">CLR</button>
              <button id="random">RND</button>
              <button id="shiny">SHINY</button>
              <button id="cry">CRY</button>
            </div>
            <button class="go" id="btn">GO</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== Footer (shows on both screens) ===== -->
    <p class="disclaimer">
      Fan-made, non-commercial project. Pokémon and all related names, images and sounds are trademarks of Nintendo,
      Game Freak and The Pokémon Company. Data from
      <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a>.
    </p>

    <p class="credit">
      <a
        class="ig"
        href="https://instagram.com/sebbyzurita"
        target="_blank"
        rel="noopener"
        aria-label="Instagram: @sebbyzurita"
      >
        <svg
          viewBox="0 0 24 24"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor"></circle>
        </svg>
        <span>@sebbyzurita</span>
      </a>
    </p>

    <!-- Order matters: data first, then helpers, then the title page, then the app (which starts everything). -->
    <script src="js/dexes.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/title.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
